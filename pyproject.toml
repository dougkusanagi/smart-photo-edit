[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-photo-edit"
version = "0.1.0"
description = "Editor de imagens com IA: interface local que roda workflows do ComfyUI (Qwen-Image 2.1)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pillow"]

[project.scripts]
smart-photo-edit = "smart_photo_edit.cli:main"

[tool.setuptools.packages.find]
include = ["smart_photo_edit*"]

[tool.setuptools.package-data]
smart_photo_edit = ["web/*", "builtin_workflows/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
