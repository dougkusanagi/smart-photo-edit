name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Test Windows launcher and installation
        if: runner.os == 'Windows'
        shell: cmd
        run: run.bat --help
      - name: Test Unix launcher and installation
        if: runner.os != 'Windows'
        shell: bash
        run: bash run.sh --help
